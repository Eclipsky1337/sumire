[package]
name = "sumire"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1.3"
include_dir = "0.7"
libc = "0.2"
mime_guess = "2.0"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
yaml-edit = "0.2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
winreg = "0.55"

[profile.release]
lto = "thin"
strip = "symbols"
